site_name: PQC Auth-Service
site_description: "Post-Quanten-Kryptografie in einem Python-Authentifizierungsservice. Semesterarbeit 3, ITCNE25, TBZ HF"
site_author: Dodoe Rumiñahui Mannale
site_url: https://ruminahuim.github.io/rib-pqc-semesterarbeit/
repo_url: https://github.com/RuminahuiM/rib-pqc-semesterarbeit
repo_name: RuminahuiM/rib-pqc-semesterarbeit
edit_uri: edit/main/docs/

theme:
  name: material
  language: de
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Helles Design

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
      # GitHub-kompatible Anker (Umlaute bleiben erhalten), damit die
      # Links aus dem Produkt-Repo hier gleich funktionieren
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: de

validation:
  links:
    anchors: warn

